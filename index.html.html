<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Damishya Manja ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#fff0f5,#ffe4ec,#fff8f0);
  color:#5b2638; display:flex; align-items:center; justify-content:center;
}
.heart{position:fixed;bottom:-30px;font-size:20px;animation:float 7s linear infinite;opacity:.7;pointer-events:none}
@keyframes float{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.card{
  width:min(90%,520px); padding:42px 28px; text-align:center;
  background:rgba(255,255,255,.82); border-radius:28px;
  box-shadow:0 15px 50px rgba(120,45,75,.18); backdrop-filter:blur(8px);
}
h1{font-size:2.2rem;margin:0 0 12px}
p{font-size:1.08rem;line-height:1.65}
button{
  border:0;border-radius:999px;padding:13px 25px;margin:9px;
  background:#d94f78;color:white;font-size:1rem;cursor:pointer;
  box-shadow:0 6px 15px rgba(217,79,120,.25);
  transition:.2s;
}
button:hover{transform:scale(1.05)}
#message{min-height:120px;display:flex;align-items:center;justify-content:center}
.small{font-size:.9rem;opacity:.7}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="screen">
    <div style="font-size:3rem">💌</div>
    <h1>Hiii, Damishya Manja ❤️</h1>
    <p>I made a tiny little surprise for you...</p>
    <p class="small">Please click the button. No cheating 👀</p>
    <button onclick="next()">Click me 🥺</button>
  </div>
</div>

<script>
const screens = [
`<div style="font-size:2.7rem">🥺</div><h1>Okay okay...</h1><p>Before anything else, I need you to know something.</p><button onclick="next()">What is it? 👀</button>`,
`<div style="font-size:2.7rem">📱❤️</div><h1>Confession time...</h1><p>Do you know that I always tend to fall in love and become shy looking at my phone...</p><button onclick="next()">Why? 😳</button>`,
`<div style="font-size:2.7rem">🙈💕</div><h1>Because...</h1><p><b>YOU ARE MY WALLPAPER.</b><br><br>BAHAHAHA 😭❤️ Every time I look at my phone and see you, I swear I still get that little shy feeling.</p><button onclick="next()">Awww... 🥹</button>`,
`<div style="font-size:2.7rem">🤍</div><h1>Something important...</h1><p>One of my favourite memories of us is seeing you being serious with me and promising me something — and then actually taking that promise seriously.</p><button onclick="next()">Keep going 💗</button>`,
`<div style="font-size:2.7rem">🥰</div><h1>And honestly?</h1><p>That is <b>hot.</b> 😭❤️<br><br>But more than that, it means a lot to me. As your hubby, knowing that your words have meaning and that you keep your promises is something I really treasure about you.</p><button onclick="next()">One last thing... 💌</button>`,
`<div style="font-size:2.7rem">🌷</div><h1>My dear Damishya...</h1><p>I don't know how many times I can say it before it becomes repetitive, but I will keep saying it anyway.</p><button onclick="next()">Tell me ❤️</button>`,
`<div style="font-size:2.7rem">❤️</div><h1>I love you.</h1><p>I will love you always and forever. Through the silly moments, the shy moments, the serious moments, and everything in between.</p><p>I can't wait to come and see you soon, my dear. Until then, keep being my favourite person — and my favourite wallpaper. 🤭❤️</p><p><b>Love, your hubby &lt;3</b></p><button onclick="finale()">❤️ Forever</button>`
];

let i=0;
function next(){ document.getElementById('screen').innerHTML=screens[++i]; }
function finale(){
  document.getElementById('screen').innerHTML =
  `<div style="font-size:4rem">💖</div><h1>Always & Forever</h1><p>Damishya Manja, it's you. It has always been you in this little corner of my heart.</p><p><b>I love you. I miss you. And I can't wait to see you soon. ❤️</b></p><p>See you soon, my dear. &lt;3</p>`;
  for(let j=0;j<18;j++) setTimeout(makeHeart,j*100);
}
function makeHeart(){
  const h=document.createElement('div'); h.className='heart';
  h.textContent=['❤️','💕','💗','💖','🌷'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'vw'; h.style.animationDuration=(4+Math.random()*4)+'s';
  document.body.appendChild(h); setTimeout(()=>h.remove(),8000);
}
setInterval(makeHeart,900);
</script>
</body>
</html>
